<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Locked - ClassWatch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f1c18;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .lock-card {
      background: #16271f;
      border: 1px solid #284437;
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 520px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .icon {
      width: 72px;
      height: 72px;
      background: #1f3d30;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 32px;
      color: #5cc79a;
      border: 2px solid #5cc79a;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #ffffff;
      font-weight: 700;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 9999px;
      background: #2a1515;
      color: #f87171;
      font-weight: 600;
      font-size: 13px;
      border: 1px solid #7f1d1d;
    }
  </style>
</head>
<body>
  <div class="lock-card">
    <div class="icon">🔒</div>
    <h1>Classroom Screen Locked</h1>
    <p>Your teacher has paused your browser screen to direct attention to the classroom board or lecture. Please look up and pay attention to your instructor.</p>
    <div class="badge">Screen Will Unlock Automatically</div>
  </div>
</body>
</html>
